name: Resolve Window
description: >-
  Resolve the watermark for an incremental job - the time of this workflow's last
  successful run - and derive the processing window from it, with an overlap for
  upstream eventual consistency.
author: Adobe

branding:
  icon: clock
  color: blue

inputs:
  workflow:
    description: >-
      Workflow file name whose run history defines the watermark, e.g. track-publishes.yml.
      Defaults to the workflow that is calling this action.
    required: false
    default: ''
  repository:
    description: 'owner/repo to read the run history from. Defaults to the current repository.'
    required: false
    default: ''
  branch:
    description: >-
      Only count runs on this branch. Defaults to the current branch, which is what a
      scheduled workflow wants. Pass '*' to count runs on any branch.
    required: false
    default: ''
  exclude-run-id:
    description: >-
      Run id to ignore when scanning. Defaults to the current run, so a re-run of a
      previously successful run cannot adopt itself as its own watermark.
    required: false
    default: ''
  overlap-seconds:
    description: >-
      Seconds subtracted from the watermark to produce `from`. This is a deliberate
      re-read to tolerate eventual consistency in the API being drained, so expect the
      window to re-deliver entries near its lower edge and dedupe downstream.
    required: false
    default: '60'
  max-pages:
    description: >-
      Pages of run history to scan (100 runs per page) before giving up. One page is not
      always enough: an outage or a cancel-in-progress backlog can fill 100 consecutive
      runs with no success.
    required: false
    default: '10'
  per-page:
    description: 'Runs requested per page, 1 to 100.'
    required: false
    default: '100'
  wide-window-hours:
    description: >-
      Emit a warning when the resolved window is at least this many hours wide, which
      means the job is catching up after a gap rather than running on schedule.
    required: false
    default: '6'
  override-start-time:
    description: >-
      Skip the run history entirely and start from this point. Accepts a timestamp or a
      duration (30s, 45m, 12h, 7d). Wire this to a workflow_dispatch input to give
      operators a recovery path after an outage longer than max-pages can cover.
    required: false
    default: ''
  initial-window:
    description: >-
      Fallback used ONLY when no run of the workflow has ever succeeded, as a duration or
      a timestamp. Leave empty to fail instead, which is the safer default for an
      established workflow: a guessed window silently skips everything before it.
    required: false
    default: ''
  checkpoint:
    description: >-
      Restore a checkpoint committed by the previous run, and prefer its position over the
      run history. Opt-in, because it adds a cache entry per run. Pair with the save action
      to commit a new position after the drain succeeds.
    required: false
    default: 'false'
  checkpoint-namespace:
    description: >-
      Names the checkpoint, so two jobs in one repository do not share a position. Defaults
      to the calling workflow's file name. The save action must be given the same value.
    required: false
    default: ''
  github-token:
    description: 'Token used to read the run history. Needs `actions: read`.'
    required: false
    default: ${{ github.token }}

outputs:
  source:
    description: 'How the watermark was determined: override, last-success or initial-window.'
    value: ${{ steps.resolve.outputs.source }}
  watermark:
    description: 'Start of the window before the overlap is applied, RFC 3339.'
    value: ${{ steps.resolve.outputs.watermark }}
  from:
    description: 'Start of the window, RFC 3339. This is watermark minus overlap-seconds.'
    value: ${{ steps.resolve.outputs.from }}
  from-epoch:
    description: 'Start of the window, epoch seconds.'
    value: ${{ steps.resolve.outputs.from-epoch }}
  from-ms:
    description: 'Start of the window, epoch milliseconds, for APIs that want millis.'
    value: ${{ steps.resolve.outputs.from-ms }}
  to:
    description: 'End of the window, RFC 3339, evaluated when the action ran.'
    value: ${{ steps.resolve.outputs.to }}
  to-epoch:
    description: 'End of the window, epoch seconds.'
    value: ${{ steps.resolve.outputs.to-epoch }}
  to-ms:
    description: 'End of the window, epoch milliseconds.'
    value: ${{ steps.resolve.outputs.to-ms }}
  age-hours:
    description: 'Whole hours between the watermark and now.'
    value: ${{ steps.resolve.outputs.age-hours }}
  age-seconds:
    description: 'Seconds between the watermark and now.'
    value: ${{ steps.resolve.outputs.age-seconds }}
  is-catchup:
    description: 'true when the window is at least wide-window-hours wide.'
    value: ${{ steps.resolve.outputs.is-catchup }}
  runs-scanned:
    description: 'How many runs were examined to find the watermark.'
    value: ${{ steps.resolve.outputs.runs-scanned }}
  pages-scanned:
    description: 'How many pages of run history were fetched.'
    value: ${{ steps.resolve.outputs.pages-scanned }}
  checkpoint-kind:
    description: >-
      Which tier the checkpoint resolved from: cursor, timestamp, page, or none when there
      was nothing to restore and the run history was used instead.
    value: ${{ steps.restore-checkpoint.outputs.checkpoint-kind }}
  resumable:
    description: 'true when a checkpoint position was restored.'
    value: ${{ steps.restore-checkpoint.outputs.resumable }}
  cursor:
    description: >-
      The stream position to resume from, when the checkpoint recorded one. Only meaningful
      if the API documents its cursor as valid in a later, independent request.
    value: ${{ steps.restore-checkpoint.outputs.cursor }}
  page:
    description: 'The page number to resume from, when the checkpoint recorded one.'
    value: ${{ steps.restore-checkpoint.outputs.page }}
  checkpoint-timestamp:
    description: >-
      The high-water mark the checkpoint recorded, in the drained API's own time domain.
      This is what `from` is derived from when a checkpoint was restored.
    value: ${{ steps.restore-checkpoint.outputs.timestamp }}
  committed-at:
    description: >-
      When the restored checkpoint was committed, as an ISO 8601 instant. Provenance: a mark
      far older than the schedule suggests runs have been failing or cancelled.
    value: ${{ steps.restore-checkpoint.outputs.committed-at }}
  committed-run:
    description: "Which run committed the restored checkpoint, as run_id-run_attempt."
    value: ${{ steps.restore-checkpoint.outputs.committed-run }}
  seen-ids-file:
    description: >-
      Path to a newline-separated list of ids already acted on, for suppressing what the
      overlap re-delivers. Use with `grep -Fxf`.
    value: ${{ steps.restore-checkpoint.outputs.seen-ids-file }}
  seen-ids-count:
    description: 'How many ids that file holds.'
    value: ${{ steps.restore-checkpoint.outputs.seen-ids-count }}
  checkpoint-file:
    description: 'Path of the checkpoint file, to hand to the save action.'
    value: ${{ steps.checkpoint-paths.outputs.file }}

runs:
  using: composite
  steps:
    # Derived here rather than in `default:` so the save action can reproduce it from the
    # same inputs, and so the cache key and the file path cannot drift apart.
    - id: checkpoint-paths
      shell: bash
      env:
        NAMESPACE: ${{ inputs.checkpoint-namespace }}
      run: bash "$GITHUB_ACTION_PATH/checkpoint-paths.sh"

    # A cache key must be unique, because entries are immutable and a repeated key is
    # silently NOT overwritten. run_attempt matters as well as run_id: without it, a
    # retried attempt hits its own first attempt's partial state and then cannot save.
    - id: cache-restore
      if: ${{ inputs.checkpoint == 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.checkpoint-paths.outputs.dir }}
        key: ${{ steps.checkpoint-paths.outputs.key-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.checkpoint-paths.outputs.key-prefix }}-

    - id: restore-checkpoint
      if: ${{ inputs.checkpoint == 'true' }}
      shell: bash
      env:
        CHECKPOINT_FILE: ${{ steps.checkpoint-paths.outputs.file }}
      run: bash "$GITHUB_ACTION_PATH/restore-checkpoint.sh"

    - id: resolve
      shell: bash
      env:
        WORKFLOW: ${{ inputs.workflow }}
        REPOSITORY: ${{ inputs.repository }}
        BRANCH: ${{ inputs.branch }}
        EXCLUDE_RUN_ID: ${{ inputs.exclude-run-id }}
        OVERLAP_SECONDS: ${{ inputs.overlap-seconds }}
        MAX_PAGES: ${{ inputs.max-pages }}
        PER_PAGE: ${{ inputs.per-page }}
        WIDE_WINDOW_HOURS: ${{ inputs.wide-window-hours }}
        OVERRIDE_START_TIME: ${{ inputs.override-start-time }}
        CHECKPOINT_TIMESTAMP: ${{ steps.restore-checkpoint.outputs.timestamp }}
        INITIAL_WINDOW: ${{ inputs.initial-window }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        # Defaults that need a context the `default:` field cannot reach reliably.
        if [ -z "${WORKFLOW:-}" ]; then
          ref="${GITHUB_WORKFLOW_REF%%@*}"
          WORKFLOW="${ref##*/}"
        fi
        if [ -z "${REPOSITORY:-}" ]; then
          REPOSITORY="$GITHUB_REPOSITORY"
        fi
        if [ -z "${BRANCH:-}" ]; then
          # Empty means "the current branch" here. The script itself treats an empty
          # BRANCH as "any branch", so it is resolved before the call, not passed through.
          BRANCH="$GITHUB_REF_NAME"
        fi
        if [ -z "${EXCLUDE_RUN_ID:-}" ]; then
          EXCLUDE_RUN_ID="$GITHUB_RUN_ID"
        fi
        export WORKFLOW REPOSITORY BRANCH EXCLUDE_RUN_ID

        # Invoked through bash rather than executed, so the action does not depend on the
        # executable bit surviving checkout, packaging or a Windows filesystem.
        bash "$GITHUB_ACTION_PATH/resolve-window.sh"

name: Released smoke

# Consumes the PUBLISHED action by tag, exactly as another repository would.
#
# The Test workflow uses `uses: ./`, which validates the working tree but proves nothing
# about whether a consumer can resolve `@v1`. That is a different failure: a major alias
# left behind by a bad release, or a tag missing action.yml, breaks every downstream
# scheduled job while this repository's own CI stays green.
#
# Runs weekly rather than on push, because it deliberately tests the released version and
# not the commit that triggered it.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  actions: read

jobs:
  consume:
    name: Consume adobe-rnd/resolve-window@v1
    runs-on: ubuntu-latest
    steps:
      # Deterministic leg: no dependency on this workflow's own history.
      - name: Resolve a window from the released action
        id: released
        uses: adobe-rnd/resolve-window@v1
        with:
          override-start-time: 90m

      # Live leg: reads this workflow's run history through the released action.
      # initial-window keeps the first ever run green.
      - name: Resolve from the real run history
        id: live
        uses: adobe-rnd/resolve-window@v1
        with:
          initial-window: 30d

      # The one path `uses: ./` cannot validate: a SUBDIRECTORY reference to a published tag.
      # GitHub downloads the whole repository and points GITHUB_ACTION_PATH at save/, so the
      # sub-action reaches its scripts through '..'. That is reasoning about the packaging
      # format, and reasoning is not evidence, so it gets exercised against the real tag.
      - name: Restore a checkpoint through the published tag
        id: cp-restore
        uses: adobe-rnd/resolve-window@v1
        with:
          checkpoint: 'true'
          checkpoint-namespace: released-smoke
          initial-window: 1h

      - name: Commit one through the published sub-action
        id: cp-save
        uses: adobe-rnd/resolve-window/save@v1
        with:
          checkpoint-namespace: released-smoke
          timestamp: ${{ steps.cp-restore.outputs.to }}
          seen-ids: released-${{ github.run_id }}
          seen-window-seconds: '60'

      - name: The published checkpoint pair must agree
        env:
          KIND: ${{ steps.cp-restore.outputs.checkpoint-kind }}
          RESUMED: ${{ steps.cp-restore.outputs.resumable }}
          CP_SOURCE: ${{ steps.cp-restore.outputs.source }}
          MARK: ${{ steps.cp-save.outputs.timestamp }}
          WANTED: ${{ steps.cp-restore.outputs.to }}
          REWOUND: ${{ steps.cp-save.outputs.rewound }}
          SEEN: ${{ steps.cp-save.outputs.seen-ids-count }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          # An empty output here is the signature of a sub-action that resolved but could not
          # find its scripts, which would otherwise look like a pass.
          [ -n "$MARK" ] || fail 'the save sub-action produced no timestamp; check it can reach ../save-checkpoint.sh'
          [ "$MARK" = "$WANTED" ] || fail "expected the mark to become $WANTED, got $MARK"
          [ "$REWOUND" = 'false' ] || fail 'the mark was rewound, which cannot happen with a forward clock'
          [ "$SEEN" -ge 1 ] || fail "expected at least one remembered id, got '$SEEN'"

          case "$KIND" in
            none)
              # First run after release, or the cache was evicted. Must still have a window.
              case "$CP_SOURCE" in
                last-success | initial-window) ;;
                *) fail "cold checkpoint fell back to '$CP_SOURCE'" ;;
              esac
              echo "checkpoint leg: cold start, fell back to $CP_SOURCE"
              ;;
            timestamp)
              [ "$RESUMED" = 'true' ] || fail "kind=timestamp but resumable='$RESUMED'"
              [ "$CP_SOURCE" = 'checkpoint' ] || fail "a restored checkpoint must drive the window, got '$CP_SOURCE'"
              echo "checkpoint leg: resumed a published checkpoint, now at $MARK"
              ;;
            *) fail "unexpected checkpoint-kind '$KIND'" ;;
          esac

      - name: The released action must behave
        env:
          SOURCE: ${{ steps.released.outputs.source }}
          AGE: ${{ steps.released.outputs.age-seconds }}
          FROM: ${{ steps.released.outputs.from }}
          LIVE_SOURCE: ${{ steps.live.outputs.source }}
          LIVE_WATERMARK: ${{ steps.live.outputs.watermark }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$SOURCE" = 'override' ] || fail "override leg: source was '$SOURCE'"
          [ "$AGE" -ge 5390 ] && [ "$AGE" -le 5500 ] \
            || fail "override leg: 90m should be about 5400s, got ${AGE}s"
          [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || fail "override leg: from is not RFC 3339: '$FROM'"

          case "$LIVE_SOURCE" in
            last-success | initial-window) ;;
            *) fail "live leg: unexpected source '$LIVE_SOURCE'" ;;
          esac
          [ -n "$LIVE_WATERMARK" ] || fail 'live leg: no watermark'

          {
            echo "### Released action smoke"
            echo ""
            echo "\`adobe-rnd/resolve-window@v1\` resolved a window."
            echo ""
            echo "| leg | source | value |"
            echo "| --- | --- | --- |"
            echo "| override 90m | $SOURCE | from \`$FROM\`, age ${AGE}s |"
            echo "| live history | $LIVE_SOURCE | watermark \`$LIVE_WATERMARK\` |"
          } >> "$GITHUB_STEP_SUMMARY"

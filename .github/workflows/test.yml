name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    # macOS is not redundant here: the script and the test harness both fall back from
    # GNU `date -u -d` to BSD `date -u -j -f`, and this leg is what proves the fallback
    # works rather than merely existing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Report the shell in use
        run: bash --version | head -1

      - name: resolve-window.sh
        run: bash tests/resolve-window.test.sh

      - name: checkpoint restore + save
        run: bash tests/checkpoint.test.sh

      - name: action contracts
        run: bash tests/action-contract.test.sh

  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck --severity=style ./*.sh tests/*.sh

  integration:
    name: Integration (the action as a caller sees it)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the action reads this workflow's own run history
    steps:
      - uses: actions/checkout@v7

      # Deterministic leg: an override needs no run history at all, so this asserts the
      # composite wiring and every output independently of what this repo has run before.
      - name: Resolve from an override
        id: override
        uses: ./
        with:
          override-start-time: 2h
          overlap-seconds: 60

      - name: The override outputs must be complete and consistent
        env:
          SOURCE: ${{ steps.override.outputs.source }}
          FROM: ${{ steps.override.outputs.from }}
          FROM_EPOCH: ${{ steps.override.outputs.from-epoch }}
          FROM_MS: ${{ steps.override.outputs.from-ms }}
          TO_EPOCH: ${{ steps.override.outputs.to-epoch }}
          AGE_SECONDS: ${{ steps.override.outputs.age-seconds }}
          IS_CATCHUP: ${{ steps.override.outputs.is-catchup }}
          SCANNED: ${{ steps.override.outputs.runs-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$SOURCE" = 'override' ] || fail "source should be override, got '$SOURCE'"
          [ "$SCANNED" = '0' ] || fail "an override must not read the run history, but scanned $SCANNED run(s)"
          [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || fail "from is not RFC 3339: '$FROM'"
          [ "$FROM_MS" = "$((FROM_EPOCH * 1000))" ] \
            || fail "from-ms ($FROM_MS) is not from-epoch ($FROM_EPOCH) in millis"
          [ "$FROM_EPOCH" -lt "$TO_EPOCH" ] || fail "from ($FROM_EPOCH) is not before to ($TO_EPOCH)"
          # 2h back, minus a 60s overlap, so 7260s give or take the runtime of the step.
          [ "$AGE_SECONDS" -ge 7190 ] && [ "$AGE_SECONDS" -le 7300 ] \
            || fail "age-seconds should be about 7200 for a 2h override, got $AGE_SECONDS"
          [ "$IS_CATCHUP" = 'false' ] || fail "a 2h window should not be flagged as a catch-up"
          echo "override leg ok: from=$FROM age=${AGE_SECONDS}s"

      # Live leg: really calls the runs API. initial-window keeps the very first run of
      # this workflow green, when by definition nothing has succeeded yet.
      - name: Resolve from the real run history
        id: live
        uses: ./
        with:
          initial-window: 7d

      - name: The live outputs must be plausible
        env:
          SOURCE: ${{ steps.live.outputs.source }}
          WATERMARK: ${{ steps.live.outputs.watermark }}
          FROM_EPOCH: ${{ steps.live.outputs.from-epoch }}
          TO_EPOCH: ${{ steps.live.outputs.to-epoch }}
          PAGES: ${{ steps.live.outputs.pages-scanned }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          case "$SOURCE" in
            last-success) echo "found a previous successful run: $WATERMARK" ;;
            initial-window) echo "no successful run yet, used initial-window: $WATERMARK" ;;
            *) fail "unexpected source '$SOURCE'" ;;
          esac
          [[ "$WATERMARK" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || fail "watermark is not RFC 3339: '$WATERMARK'"
          [ "$FROM_EPOCH" -lt "$TO_EPOCH" ] || fail "from is not before to"
          if [ "$SOURCE" = 'last-success' ] && [ "$PAGES" -lt 1 ]; then
            fail "a resolved watermark must have taken at least one page, got $PAGES"
          fi

      # Negative leg: the action must fail loudly on a workflow that does not exist,
      # rather than returning an empty window that would silently process nothing.
      - name: A missing workflow must fail
        id: missing
        continue-on-error: true
        uses: ./
        with:
          workflow: this-workflow-does-not-exist.yml

      - name: Confirm the missing workflow failed
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != 'failure' ]; then
            echo "::error::a nonexistent workflow should fail the action, but the outcome was '$OUTCOME'"
            exit 1
          fi
          echo "missing-workflow leg ok: the action failed as it should"

  checkpoint:
    name: Checkpoint round trip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # The namespace is unique per run ATTEMPT so this job always starts with no checkpoint.
    # A fixed namespace would make the job restore its own previous run's state, and the
    # "nothing to restore" assertion below would pass once and then fail forever.
    # Cross-run cache handoff is covered by checkpoint-smoke.yml instead.
    env:
      NS: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: First pass - there is nothing to restore
        id: first
        uses: ./
        with:
          checkpoint: 'true'
          checkpoint-namespace: ${{ env.NS }}
          initial-window: 1h

      - name: A cold checkpoint must fall back, not fail
        env:
          KIND: ${{ steps.first.outputs.checkpoint-kind }}
          RESUMABLE: ${{ steps.first.outputs.resumable }}
          SOURCE: ${{ steps.first.outputs.source }}
          SEEN: ${{ steps.first.outputs.seen-ids-count }}
          FILE: ${{ steps.first.outputs.checkpoint-file }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$KIND" = 'none' ] || fail "expected kind=none on a cold start, got '$KIND'"
          [ "$RESUMABLE" = 'false' ] || fail "expected resumable=false, got '$RESUMABLE'"
          [ "$SEEN" = '0' ] || fail "expected no remembered ids, got '$SEEN'"
          # It must still have produced a window, from the run history or initial-window.
          case "$SOURCE" in
            last-success | initial-window) echo "fell back to source=$SOURCE" ;;
            *) fail "expected a fallback window, got source='$SOURCE'" ;;
          esac
          [ -n "$FILE" ] || fail 'no checkpoint-file was reported'

      - name: Commit a checkpoint
        id: commit
        uses: ./save
        with:
          checkpoint-namespace: ${{ env.NS }}
          timestamp: '2026-01-02T03:04:05Z'
          seen-ids: |
            alpha
            beta
          seen-window-seconds: '600'

      - name: The commit must report what it wrote
        env:
          KIND: ${{ steps.commit.outputs.checkpoint-kind }}
          TS: ${{ steps.commit.outputs.timestamp }}
          SEEN: ${{ steps.commit.outputs.seen-ids-count }}
          REWOUND: ${{ steps.commit.outputs.rewound }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$KIND" = 'timestamp' ] || fail "expected kind=timestamp, got '$KIND'"
          [ "$TS" = '2026-01-02T03:04:05Z' ] || fail "expected the mark back, got '$TS'"
          [ "$SEEN" = '2' ] || fail "expected 2 remembered ids, got '$SEEN'"
          [ "$REWOUND" = 'false' ] || fail "nothing should have been rewound, got '$REWOUND'"

      - name: Second pass - the checkpoint now drives the window
        id: second
        uses: ./
        with:
          checkpoint: 'true'
          checkpoint-namespace: ${{ env.NS }}
          overlap-seconds: '60'

      - name: The restored checkpoint must outrank the run history
        env:
          KIND: ${{ steps.second.outputs.checkpoint-kind }}
          RESUMABLE: ${{ steps.second.outputs.resumable }}
          SOURCE: ${{ steps.second.outputs.source }}
          CP_TS: ${{ steps.second.outputs.checkpoint-timestamp }}
          FROM: ${{ steps.second.outputs.from }}
          SCANNED: ${{ steps.second.outputs.runs-scanned }}
          SEEN: ${{ steps.second.outputs.seen-ids-count }}
          SEEN_FILE: ${{ steps.second.outputs.seen-ids-file }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ "$KIND" = 'timestamp' ] || fail "expected kind=timestamp, got '$KIND'"
          [ "$RESUMABLE" = 'true' ] || fail "expected resumable=true, got '$RESUMABLE'"
          [ "$CP_TS" = '2026-01-02T03:04:05Z' ] || fail "expected the committed mark, got '$CP_TS'"

          # The point of the whole exercise: the window comes from the DATA's clock, and
          # the run history is not consulted at all.
          [ "$SOURCE" = 'checkpoint' ] || fail "expected source=checkpoint, got '$SOURCE'"
          [ "$SCANNED" = '0' ] || fail "the run history should not have been read, but scanned $SCANNED"
          [ "$FROM" = '2026-01-02T03:03:05Z' ] || fail "expected the mark minus a 60s overlap, got '$FROM'"

          [ "$SEEN" = '2' ] || fail "expected 2 remembered ids, got '$SEEN'"
          grep -qx alpha "$SEEN_FILE" || fail "the seen-ids file is missing 'alpha'"
          grep -qx beta "$SEEN_FILE" || fail "the seen-ids file is missing 'beta'"
          echo "checkpoint leg ok: window from $FROM, $SEEN id(s) suppressed"

      # A distinct namespace, so this second commit does not collide with the first on a
      # cache key that cannot be rewritten - which is exactly what save now warns about.
      # Pointing checkpoint-file at the first step's file keeps the mark being tested the
      # same one, and covers the checkpoint-file override at the same time.
      - name: A rewind must be refused
        id: rewind
        uses: ./save
        with:
          checkpoint-namespace: ${{ env.NS }}-rewind
          checkpoint-file: ${{ steps.first.outputs.checkpoint-file }}
          timestamp: '2020-01-01T00:00:00Z'

      - name: The mark must not have moved backwards
        env:
          TS: ${{ steps.rewind.outputs.timestamp }}
          REWOUND: ${{ steps.rewind.outputs.rewound }}
        run: |
          set -euo pipefail
          if [ "$TS" != '2026-01-02T03:04:05Z' ] || [ "$REWOUND" != 'false' ]; then
            echo "::error::a backwards timestamp should have been refused, but the mark is now '$TS' (rewound=$REWOUND)"
            exit 1
          fi
          echo "rewind guard ok: the mark is still $TS"
